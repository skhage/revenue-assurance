bundle:
  name: ra-exceptions-console

# The repo-root Python .gitignore has a `lib/` rule that otherwise excludes
# client/src/lib/ from the bundle sync (breaking the app build). Force-include it.
sync:
  include:
    - client/src/lib/**

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID
  postgres_branch:
    description: Full Lakebase Postgres branch resource name. Obtain by running `databricks postgres list-branches {project-name}`, select the desired item from the output array and use its .name value. Requires the project resource name.
  postgres_database:
    description: Full Lakebase Postgres database resource name. Obtain by running `databricks postgres list-databases {branch-name}`, select the desired item from the output array and use its .name value. Requires the branch resource name.
  postgres_project:
    description: Full Lakebase Postgres project resource name. Obtain by running `databricks postgres list-projects`, select the desired item from the output array and use its .name value.

  # Optional — power the "Open in workspace" links on the in-app Architecture
  # page. Each defaults to empty so the bundle validates/deploys with no
  # extra input; the Architecture page falls back to the relevant workspace
  # list page (Pipelines / Jobs / Dashboards / Genie) when a value is unset.
  ra_pipeline_id:
    description: >-
      Pipeline ID of the ra_medallion_pipeline Lakeflow Declarative Pipeline
      (resources/reconciliation_pipeline.yml in the repo root bundle). Get it
      via `databricks pipelines list-pipelines --profile <name>`.
    default: ""
  ra_ml_job_id:
    description: >-
      Job ID of ra_anomaly_ml_pipeline (root bundle resources/ml_pipeline.yml).
      Get it via `databricks jobs list --profile <name>`.
    default: ""
  ra_datasim_job_id:
    description: >-
      Job ID of simulate_source_systems (root bundle resources/datasim_job.yml).
      Get it via `databricks jobs list --profile <name>`.
    default: ""
  ra_dashboard_id:
    description: >-
      Dashboard ID of the "Lakelink Fiber — Revenue Assurance Command Center"
      AI/BI dashboard (root bundle resources/dashboard.yml).
    default: ""
  ra_genie_space_id:
    description: >-
      Space ID of the RA Genie space (root bundle
      resources/revenue_assurance.geniespace.json). Find it on the Genie
      space's About tab. Also powers the in-app Genie chat tab.
    default: ""
  genie_space_name:
    description: Display name of the RA Genie space (for the app resource binding).
    default: "Lakelink Fiber Revenue Assurance Analyst"

  # Agent Bricks supervisors proxied by server/routes/command-center.ts and the
  # recovery orchestrator used by server/routes/chat.ts. The app SP gets
  # CAN_QUERY on each via the serving_endpoint resources below
  # (RA-APP-SERVING-ENDPOINT-RESOURCES). Each name is injected into the app as
  # an env var via config.env value_from (RA-APP-AGENT-ENDPOINTS-PARAM-1110).
  # Public repo: supply the real names with --var at deploy time; the server
  # answers 503 for any agent whose value is still a REPLACE_WITH_* placeholder.
  command_center_endpoint:
    description: Revenue Recovery Command Center supervisor (Agent Bricks MAS). Env COMMAND_CENTER_ENDPOINT.
    default: "REPLACE_WITH_COMMAND_CENTER_ENDPOINT"
  contract_risk_endpoint:
    description: Contract-risk specialist supervisor (Agent Bricks MAS). Env CONTRACT_RISK_ENDPOINT.
    default: "REPLACE_WITH_CONTRACT_RISK_ENDPOINT"
  adjustment_fraud_endpoint:
    description: Adjustment-fraud specialist supervisor (Agent Bricks MAS). Env ADJUSTMENT_FRAUD_ENDPOINT.
    default: "REPLACE_WITH_ADJUSTMENT_FRAUD_ENDPOINT"
  order_provisioning_endpoint:
    description: Order-to-Provisioning Integrity supervisor (Agent Bricks MAS). Env ORDER_PROVISIONING_ENDPOINT.
    default: "REPLACE_WITH_ORDER_PROVISIONING_ENDPOINT"
  triage_analytics_endpoint:
    description: Triage / root-cause supervisor (Agent Bricks MAS). Env TRIAGE_ANALYTICS_ENDPOINT.
    default: "REPLACE_WITH_TRIAGE_ANALYTICS_ENDPOINT"
  recovery_orchestrator_endpoint:
    description: Recovery orchestrator agent used by the /api/chat route. Env RECOVERY_ORCHESTRATOR_ENDPOINT.
    default: "REPLACE_WITH_RECOVERY_ORCHESTRATOR_ENDPOINT"
  playbook_ka_endpoint:
    description: >-
      RA Investigation Playbook Knowledge Assistant serving endpoint used by
      /api/playbook-guidance. Injected into the app as PLAYBOOK_KA_ENDPOINT via
      the playbook-ka-agent resource. Public repo: supply the real name with
      --var playbook_ka_endpoint=<name> at deploy time.
    default: "REPLACE_WITH_PLAYBOOK_KA_ENDPOINT"

resources:
  apps:
    app:
      name: "ra-exceptions-console"
      description: "Revenue Assurance Exceptions Console — leakage detection, triage, and case management over cdm_tmforum"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      user_api_scopes:
        - sql
        - dashboards.genie

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: postgres
          postgres:
            branch: ${var.postgres_branch}
            database: ${var.postgres_database}
            permission: CAN_CONNECT_AND_CREATE
        # Governed access for the in-app Genie chat tab (Gap 4). The app SP runs
        # the space with CAN_RUN; the plugin reads DATABRICKS_GENIE_SPACE_ID.
        - name: genie-space
          genie_space:
            name: ${var.genie_space_name}
            space_id: ${var.ra_genie_space_id}
            permission: CAN_RUN
        # Serving endpoints called server-side as the app SP (no DATABRICKS_TOKEN).
        - name: command-center-agent
          serving_endpoint:
            name: ${var.command_center_endpoint}
            permission: CAN_QUERY
        - name: contract-risk-agent
          serving_endpoint:
            name: ${var.contract_risk_endpoint}
            permission: CAN_QUERY
        - name: adjustment-fraud-agent
          serving_endpoint:
            name: ${var.adjustment_fraud_endpoint}
            permission: CAN_QUERY
        - name: order-provisioning-agent
          serving_endpoint:
            name: ${var.order_provisioning_endpoint}
            permission: CAN_QUERY
        - name: triage-analytics-agent
          serving_endpoint:
            name: ${var.triage_analytics_endpoint}
            permission: CAN_QUERY
        - name: recovery-orchestrator-agent
          serving_endpoint:
            name: ${var.recovery_orchestrator_endpoint}
            permission: CAN_QUERY
        - name: playbook-ka-agent
          serving_endpoint:
            name: ${var.playbook_ka_endpoint}
            permission: CAN_QUERY

      # App runtime environment. NOTE: this bundle-level `config.env` REPLACES
      # app.yaml's `env` block on deploy (it does not merge), so the resource
      # bindings the app needs to boot must live here too — otherwise the app
      # crashes at startup with "Warehouse ID not found". The RA_* entries below
      # are the plain, bundle-variable-resolved values that power the in-app
      # Architecture page's "Open in workspace" deep links.
      config:
        env:
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: sql-warehouse
          - name: LAKEBASE_ENDPOINT
            value_from: postgres
          - name: RA_PIPELINE_ID
            value: ${var.ra_pipeline_id}
          - name: RA_ML_JOB_ID
            value: ${var.ra_ml_job_id}
          - name: RA_DATASIM_JOB_ID
            value: ${var.ra_datasim_job_id}
          - name: RA_DASHBOARD_ID
            value: ${var.ra_dashboard_id}
          - name: RA_GENIE_SPACE_ID
            value: ${var.ra_genie_space_id}
          # Read by the @databricks/appkit genie() plugin for the in-app chat tab.
          - name: DATABRICKS_GENIE_SPACE_ID
            value_from: genie-space
          - name: RA_LAKEBASE_PROJECT
            value: ${var.postgres_project}
          # Playbook KA endpoint name for /api/playbook-guidance (not hardcoded).
          - name: PLAYBOOK_KA_ENDPOINT
            value_from: playbook-ka-agent
          # Agent Bricks supervisor + orchestrator endpoint names (not hardcoded).
          - name: COMMAND_CENTER_ENDPOINT
            value_from: command-center-agent
          - name: CONTRACT_RISK_ENDPOINT
            value_from: contract-risk-agent
          - name: ADJUSTMENT_FRAUD_ENDPOINT
            value_from: adjustment-fraud-agent
          - name: ORDER_PROVISIONING_ENDPOINT
            value_from: order-provisioning-agent
          - name: TRIAGE_ANALYTICS_ENDPOINT
            value_from: triage-analytics-agent
          - name: RECOVERY_ORCHESTRATOR_ENDPOINT
            value_from: recovery-orchestrator-agent

targets:
  default:
    default: true
    # Workspace host resolves from the CLI profile — always deploy with
    # `--profile <name>` (e.g. `databricks apps deploy --profile <name>`).
    # Do not hardcode the workspace hostname in this public repo.

    variables:
      # Public repo: supply real values at deploy time via --var or a local,
      # untracked target-override file. Never commit real resource IDs here.
      #   databricks apps deploy --profile <name> \
      #     --var sql_warehouse_id=<id> \
      #     --var postgres_branch=projects/<project>/branches/production \
      #     --var postgres_database=projects/<project>/branches/production/databases/databricks-postgres \
      #     --var postgres_project=projects/<project> \
      #     --var playbook_ka_endpoint=<ka-endpoint-name> \
      #     --var command_center_endpoint=<command-center-mas-endpoint> \
      #     --var contract_risk_endpoint=<contract-risk-mas-endpoint> \
      #     --var adjustment_fraud_endpoint=<adjustment-fraud-mas-endpoint> \
      #     --var order_provisioning_endpoint=<order-provisioning-mas-endpoint> \
      #     --var triage_analytics_endpoint=<triage-analytics-mas-endpoint> \
      #     --var recovery_orchestrator_endpoint=<recovery-orchestrator-endpoint>
      #   Optional (Architecture page links / Genie tab): --var ra_pipeline_id, ra_ml_job_id,
      #   ra_datasim_job_id, ra_dashboard_id, ra_genie_space_id, genie_space_name.
      # Keep the real values outside the repo (e.g. an untracked local vars file).
      sql_warehouse_id: REPLACE_WITH_SQL_WAREHOUSE_ID
      postgres_branch: REPLACE_WITH_POSTGRES_BRANCH
      postgres_database: REPLACE_WITH_POSTGRES_DATABASE
      postgres_project: REPLACE_WITH_POSTGRES_PROJECT
      # Architecture page deep links — override at deploy time.
      ra_pipeline_id: ""
      ra_ml_job_id: ""
      ra_datasim_job_id: ""
      ra_dashboard_id: ""
      ra_genie_space_id: ""
