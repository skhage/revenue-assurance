<style>
/* Art direction inherited from demo-artifacts/B2B Broadband Revenue Assurance.html:
   cool neutral surfaces, teal primary accent, warning/error reserved for leakage severity.
   Typography: General Sans (UI) + JetBrains Mono (financial figures). Dense, dashboard-grade. */
:root, [data-theme="light"] {
  --color-bg:#f5f6f5; --color-surface:#ffffff; --color-surface-2:#fbfbfa;
  --color-surface-offset:#eef0ef; --color-surface-offset-2:#e6e9e7; --color-surface-dynamic:#dfe3e1;
  --color-divider:#dfe1df; --color-border:#d3d6d3;
  --color-text:#1c2321; --color-text-muted:#5c6663; --color-text-faint:#676e6b; --color-text-inverse:#f7f8f7;
  --color-primary:#0a6e6e; --color-primary-hover:#075454; --color-primary-active:#053e3e; --color-primary-highlight:#cfe3e1;
  --color-warning:#96530f; --color-warning-hover:#713e0b; --color-warning-highlight:#e6d8c6;
  --color-error:#9c2b2b; --color-error-hover:#7a2020; --color-error-highlight:#e6cccc;
  --color-success:#2f6d3a; --color-success-highlight:#d3e2d5;
  --color-gold:#89590b; --color-gold-highlight:#ecdfc0;
  --color-brand:#ff5f46; --color-brand-highlight:#fabfba;
  --radius-sm:.375rem; --radius-md:.5rem; --radius-lg:.75rem; --radius-xl:1rem; --radius-full:9999px;
  --transition-interactive:180ms cubic-bezier(.16,1,.3,1);
  --shadow-sm:0 1px 2px oklch(0.2 0.01 165/.06); --shadow-md:0 4px 12px oklch(0.2 0.01 165/.08); --shadow-lg:0 12px 32px oklch(0.2 0.01 165/.14);
  --font-body:'General Sans','Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
}
[data-theme="dark"] {
  --color-bg:#14181a; --color-surface:#1a1f21; --color-surface-2:#1e2325;
  --color-surface-offset:#20262a; --color-surface-offset-2:#262d31; --color-surface-dynamic:#2d3538;
  --color-divider:#272e31; --color-border:#374045;
  --color-text:#dee3e1; --color-text-muted:#8a9491; --color-text-faint:#868d8a; --color-text-inverse:#171b1c;
  --color-primary:#5bb0ac; --color-primary-hover:#7ecac6; --color-primary-highlight:#243838;
  --color-warning:#d99a58; --color-warning-highlight:#3d3324;
  --color-error:#e58080; --color-error-highlight:#3e2626;
  --color-success:#7fc98d; --color-success-highlight:#243228;
  --color-gold:#e0b653; --color-gold-highlight:#3a3222;
  --color-brand:#ff7a63; --color-brand-highlight:#3a2420;
  --shadow-sm:0 1px 2px oklch(0 0 0/.3); --shadow-md:0 4px 12px oklch(0 0 0/.4); --shadow-lg:0 12px 32px oklch(0 0 0/.5);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--font-body);color:var(--color-text);background:var(--color-bg);min-height:100dvh;line-height:1.5;overflow:hidden}
img,svg{display:block}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
a{color:inherit;text-decoration:none}
table{border-collapse:collapse;width:100%}
:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums lining-nums}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media (prefers-reduced-motion:reduce){
  .slide{transition:none}
  .deck-progress-fill{transition:none}
  html{scroll-behavior:auto}
}

/* ============ Deck shell ============ */
.deck{position:relative;height:100dvh;display:flex;flex-direction:column}
.deck-chrome{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:1px solid var(--color-divider);background:var(--color-surface);gap:16px;flex-shrink:0}
.deck-chrome .brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;color:var(--color-text-muted)}
.deck-chrome .brand svg{width:18px;height:18px;color:var(--color-brand)}
.deck-progress{flex:1;height:3px;background:var(--color-surface-offset);border-radius:var(--radius-full);overflow:hidden;margin:0 4px}
.deck-progress-fill{height:100%;background:var(--color-primary);transition:width 220ms ease}
.deck-controls{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--color-text-faint)}
.deck-controls .count{font-family:var(--font-mono);min-width:52px;text-align:center}
.icon-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md);color:var(--color-text-muted)}
.icon-btn:hover{background:var(--color-surface-offset);color:var(--color-text)}
.icon-btn svg{width:16px;height:16px}
.icon-btn.on{background:var(--color-primary-highlight);color:var(--color-primary)}

.deck-body{flex:1;display:flex;min-height:0}
.stage-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:28px;min-width:0;overflow:auto}
.stage{width:100%;max-width:1180px;aspect-ratio:16/9;background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);position:relative;overflow:hidden;display:flex;flex-direction:column}
:fullscreen .stage-wrap{padding:0}
:fullscreen .stage{max-width:none;width:100vw;height:100vh;aspect-ratio:auto;border-radius:0;border:none}
:fullscreen .deck-chrome{display:none}
:fullscreen .notes-pane{position:fixed;right:0;top:0;bottom:0;z-index:20}

.slide{position:absolute;inset:0;display:flex;flex-direction:column;padding:44px 56px;opacity:0;transform:translateY(6px);transition:opacity 200ms ease,transform 200ms ease;pointer-events:none}
.slide.active{opacity:1;transform:none;pointer-events:auto;position:relative}
.slide-kicker{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--color-primary);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.slide-kicker .seg{color:var(--color-text-faint);font-weight:500}
.slide h2{font-size:30px;font-weight:700;line-height:1.15;letter-spacing:-.01em;margin-bottom:4px}
.slide .sub{font-size:15px;color:var(--color-text-muted);margin-bottom:18px}
.slide-content{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:16px}
.slide.dense .slide-content{font-size:13.5px}

/* Title slide */
.title-slide{align-items:center;justify-content:center;text-align:center;gap:6px}
.title-slide .wordmark{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.title-slide .wordmark svg{width:40px;height:40px;color:var(--color-brand)}
.title-slide h1{font-size:40px;font-weight:700;letter-spacing:-.01em}
.title-slide .tagline{font-size:17px;color:var(--color-text-muted);margin-top:6px;max-width:640px}
.hero-number{font-family:var(--font-mono);font-weight:700;font-size:64px;letter-spacing:-.02em;color:var(--color-error);margin:22px 0 6px}
.hero-caption{font-size:13px;color:var(--color-text-faint);max-width:520px}
.audience-row{display:flex;gap:24px;margin-top:26px;font-size:12.5px;color:var(--color-text-muted)}
.audience-row b{color:var(--color-text)}

/* Generic content blocks reused across slides */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:var(--color-surface-2);border:1px solid var(--color-divider);border-radius:var(--radius-lg);padding:16px 18px}
.card h3{font-size:14px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.card p, .card li{font-size:13px;color:var(--color-text-muted);line-height:1.5}
.card ul{padding-left:18px;display:flex;flex-direction:column;gap:4px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:var(--radius-full)}
.pill.illustrative{background:var(--color-gold-highlight);color:var(--color-gold)}
.pill.measured{background:var(--color-primary-highlight);color:var(--color-primary)}
.pill.roadmap{background:var(--color-surface-offset-2);color:var(--color-text-muted)}
.pill.high{background:var(--color-error-highlight);color:var(--color-error)}
.pill.med{background:var(--color-warning-highlight);color:var(--color-warning)}
.stat-row{display:flex;gap:22px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .num{font-family:var(--font-mono);font-weight:700;font-size:22px}
.stat .lbl{font-size:11.5px;color:var(--color-text-faint)}
.flow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.flow .node{flex:1;min-width:160px;background:var(--color-surface-2);border:1px solid var(--color-divider);border-radius:var(--radius-lg);padding:14px 16px}

.flow .arrow svg{width:18px;height:18px}

table.deck-table{font-size:12.5px}
table.deck-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--color-text-faint);padding:7px 10px;border-bottom:1px solid var(--color-divider)}
table.deck-table td{padding:8px 10px;border-bottom:1px solid var(--color-divider);vertical-align:top}
table.deck-table tr:last-child td{border-bottom:none}
.quote-block{border-left:3px solid var(--color-primary);padding:10px 16px;font-size:13.5px;color:var(--color-text-muted);font-style:italic;background:var(--color-primary-highlight);border-radius:0 var(--radius-md) var(--radius-md) 0}
.mock-frame{border:1px solid var(--color-divider);border-radius:var(--radius-md);overflow:hidden;background:var(--color-surface-offset)}
.mock-frame .mock-bar{display:flex;gap:6px;align-items:center;padding:6px 10px;background:var(--color-surface-2);border-bottom:1px solid var(--color-divider);font-size:10.5px;color:var(--color-text-faint)}
.mock-frame .mock-bar .dot{width:7px;height:7px;border-radius:50%}
.two-col-notes{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.footer-evidence{margin-top:auto;padding-top:10px;border-top:1px solid var(--color-divider);display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--color-text-faint);flex-wrap:wrap}
.footer-evidence svg{width:12px;height:12px;flex-shrink:0}
.footer-evidence code{font-family:var(--font-mono);background:var(--color-surface-offset);padding:1px 5px;border-radius:4px}

/* Notes pane */
.notes-pane{width:380px;flex-shrink:0;border-left:1px solid var(--color-divider);background:var(--color-surface);display:none;flex-direction:column;min-height:0}
.notes-pane.open{display:flex}
.notes-pane-header{padding:14px 16px;border-bottom:1px solid var(--color-divider);display:flex;align-items:center;justify-content:space-between}
.notes-pane-header h3{font-size:13px;font-weight:600}
.notes-pane-header .timing{font-family:var(--font-mono);font-size:12px;color:var(--color-primary);font-weight:600}
.notes-pane-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.notes-section h4{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--color-text-faint);margin-bottom:6px}
.notes-section p{font-size:13px;line-height:1.55;color:var(--color-text)}
.notes-section ul{padding-left:16px;font-size:12.5px;color:var(--color-text-muted);display:flex;flex-direction:column;gap:4px}

/* Slide picker (grid overview) */
.overview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:20px;overflow-y:auto;height:100%}
.overview-grid .thumb{border:1px solid var(--color-divider);border-radius:var(--radius-md);padding:10px;background:var(--color-surface-2);cursor:pointer;font-size:11px;display:flex;flex-direction:column;gap:4px}
.overview-grid .thumb:hover{border-color:var(--color-primary)}
.overview-grid .thumb .idx{font-family:var(--font-mono);color:var(--color-text-faint)}
.overview-grid .thumb .t{font-weight:600;font-size:12px;line-height:1.3}
.overview-mode .stage-wrap{display:none}
.overview-mode .overview-shell{display:block;width:100%;height:100%}
.overview-shell{display:none}

@media (max-width:1024px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}.notes-pane{width:320px}}
@media (max-width:768px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}.notes-pane{display:none!important}.slide{padding:24px}}
</style>

const SLIDES = [

// ---------- 1. TITLE ----------
{

  body: `
    <div class="wordmark">
      <svg viewBox="0 0 512 512" fill="none"><path d="M64 64H224V224H64V64Z" fill="currentColor" opacity=".55"/><path d="M440 448L280 448L280 352C280 316.654 308.654 288 344 288L376 288C411.346 288 440 316.654 440 352L440 448Z" fill="currentColor" opacity=".55"/><path d="M152 288L240 448H64L152 288Z" fill="currentColor"/><path d="M280 148C280 101.608 317.608 64 364 64V64C410.392 64 448 101.608 448 148V148C448 194.392 410.392 232 364 232V232C317.608 232 280 194.392 280 148V148Z" fill="currentColor"/></svg>

{

<script>
/* ===================== DECK ENGINE ===================== */
(function(){
  const root = document.documentElement;
  const stage = document.getElementById('stage');
  const slideCountEl = document.getElementById('slideCount');
  const progressFill = document.getElementById('progressFill');
  const notesPane = document.getElementById('notesPane');
  const notesTitle = document.getElementById('notesTitle');
  const notesTiming = document.getElementById('notesTiming');
  const notesBody = document.getElementById('notesBody');
  const overviewGrid = document.getElementById('overviewGrid');
  const deckEl = document.getElementById('deck');
  const progressBar = document.getElementById('progressBar');
  const slideAnnouncer = document.getElementById('slideAnnouncer');

  let current = 0;
  const total = SLIDES.length;
  progressBar.setAttribute('aria-valuemax', String(total));

  function evidenceHtml(list){
    if(!list || !list.length) return '';
    const items = list.map(function(e){ return '<code>'+e+'</code>'; }).join('');
    return '<div class="footer-evidence"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>Evidence: '+items+'</div>';
  }

  function renderStage(){
    stage.innerHTML = SLIDES.map(function(s, i){
      const kicker = s.kicker ? '<div class="slide-kicker">'+s.kicker+(s.segment ? ' <span class="seg">· '+s.segment+'</span>' : '')+'</div>' : '';
      const sub = s.sub ? '<div class="sub">'+s.sub+'</div>' : '';
      const h2 = s.title ? '<h2>'+s.title+'</h2>' : '';
      const dense = s.dense ? ' dense' : '';
      return '<div class="slide'+(s.variant ? ' '+s.variant : '')+dense+'" data-idx="'+i+'">'+
        kicker + h2 + sub +
        '<div class="slide-content">'+s.body+'</div>' +
        evidenceHtml(s.evidence) +
        '</div>';
    }).join('');
  }

  function renderOverview(){
    overviewGrid.innerHTML = SLIDES.map(function(s, i){
      const label = 'Go to slide '+(i+1)+' of '+total+': '+(s.title || s.kicker || 'Slide');
      return '<button class="thumb" data-goto="'+i+'" aria-label="'+label.replace(/"/g,'&quot;')+'"><span class="idx">'+(i+1)+' / '+total+'</span><span class="t">'+(s.title || s.kicker || 'Slide')+'</span></button>';
    }).join('');
    overviewGrid.querySelectorAll('[data-goto]').forEach(function(btn){
      btn.addEventListener('click', function(){
        goTo(parseInt(btn.getAttribute('data-goto'), 10));
        deckEl.classList.remove('overview-mode');
      });
    });
  }

  function renderNotes(){
    const s = SLIDES[current];
    const n = s.notes || {};
    notesTitle.textContent = s.title || s.kicker || ('Slide ' + (current+1));
    notesTiming.textContent = n.timing || '';
    let html = '';
    if(n.tell){
      html += '<div class="notes-section"><h4>Talk track</h4><p>'+n.tell+'</p></div>';
    }
    if(n.cues && n.cues.length){
      html += '<div class="notes-section"><h4>Demo cues</h4><ul>'+n.cues.map(function(c){return '<li>'+c+'</li>';}).join('')+'</ul></div>';
    }
    if(n.translate){
      html += '<div class="notes-section"><h4>Executive / technical translation</h4><p>'+n.translate+'</p></div>';
    }
    if(n.objection){
      html += '<div class="notes-section"><h4>If challenged</h4><p>'+n.objection+'</p></div>';
    }
    if(n.fallback){
      html += '<div class="notes-section"><h4>If this surface stalls &gt;10s</h4><p>'+n.fallback+'</p></div>';
    }
    if(n.silent){
      html += '<div class="notes-section"><h4>Note</h4><p style="color:var(--color-text-faint);font-style:italic">'+n.silent+'</p></div>';
    }
    notesBody.innerHTML = html || '<p style="font-size:13px;color:var(--color-text-faint)">No notes for this slide.</p>';
  }

  function update(){
    stage.querySelectorAll('.slide').forEach(function(el, i){
      el.classList.toggle('active', i === current);
    });
    slideCountEl.textContent = (current+1) + ' / ' + total;
    progressFill.style.width = (((current+1)/total)*100) + '%';
    progressBar.setAttribute('aria-valuenow', String(current+1));
    renderNotes();
    history.replaceState(null, '', '#slide-'+(current+1));
    const s = SLIDES[current];
    slideAnnouncer.textContent = 'Slide ' + (current+1) + ' of ' + total + ': ' + (s.title || s.kicker || '');
  }

  function goTo(i){
    current = Math.max(0, Math.min(total-1, i));
    update();
  }
  function next(){ goTo(current+1); }
  function prev(){ goTo(current-1); }

  document.getElementById('btnNext').addEventListener('click', next);
  document.getElementById('btnPrev').addEventListener('click', prev);

  document.getElementById('btnNotes').addEventListener('click', function(){
    const open = notesPane.classList.toggle('open');
    this.classList.toggle('on', open);
    this.setAttribute('aria-pressed', String(open));
  });

  document.getElementById('btnOverview').addEventListener('click', function(){
    const on = deckEl.classList.toggle('overview-mode');
    this.classList.toggle('on', on);
    this.setAttribute('aria-pressed', String(on));
  });

  document.getElementById('btnFullscreen').addEventListener('click', function(){
    if(!document.fullscreenElement){
      deckEl.requestFullscreen().catch(function(){});
    } else {
      document.exitFullscreen();
    }
  });
  document.addEventListener('fullscreenchange', function(){
    document.getElementById('btnFullscreen').setAttribute('aria-pressed', String(!!document.fullscreenElement));
  });

  document.getElementById('btnTheme').addEventListener('click', function(){
    const d = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', d);
    this.setAttribute('aria-pressed', String(d === 'dark'));
  });

  document.addEventListener('keydown', function(e){
    if(e.target && (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT')) return;
    if(e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' '){ e.preventDefault(); next(); }
    else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); prev(); }
    else if(e.key === 'Home'){ goTo(0); }
    else if(e.key === 'End'){ goTo(total-1); }
    else if(e.key.toLowerCase() === 'n'){ document.getElementById('btnNotes').click(); }
    else if(e.key.toLowerCase() === 'o'){ document.getElementById('btnOverview').click(); }
    else if(e.key.toLowerCase() === 'f'){ document.getElementById('btnFullscreen').click(); }
    else if(e.key === 'Escape' && deckEl.classList.contains('overview-mode')){ deckEl.classList.remove('overview-mode'); }
  });

  let touchStartX = null;
  document.getElementById('stageWrap').addEventListener('touchstart', function(e){ touchStartX = e.touches[0].clientX; }, {passive:true});
  document.getElementById('stageWrap').addEventListener('touchend', function(e){
    if(touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 60){ dx < 0 ? next() : prev(); }
    touchStartX = null;
  }, {passive:true});

  (function initTheme(){
    const preferred = matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
    root.setAttribute('data-theme', preferred);
    document.getElementById('btnTheme').setAttribute('aria-pressed', String(preferred === 'dark'));
  })();

  const hashIdx = parseInt((location.hash.match(/slide-(\d+)/) || [])[1], 10);
  renderStage();
  renderOverview();
  goTo(!isNaN(hashIdx) ? hashIdx - 1 : 0);
})();
</script>
